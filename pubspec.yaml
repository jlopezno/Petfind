name: petfindr
description: Aplicacion de adopcion y encuentro de mascotas perdidas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.0.0
  supabase_flutter: ^2.5.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  image_picker: ^1.1.0
  flutter_local_notifications: ^17.0.0
  cached_network_image: ^3.3.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

dependency_overrides:
  url_launcher_android: 6.3.29

flutter:
  uses-material-design: true
  assets:
    - mockups/Onboarding/for_onboarding1.png
    - mockups/Onboarding/for_onboarding2.png
    - mockups/Onboarding/for_onboarding3.png.png
