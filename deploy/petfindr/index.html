<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetFindr</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f6f6f7;
        color: #171717;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 360px; }
      .mark {
        align-items: center;
        background: #6c4df6;
        border-radius: 50%;
        color: white;
        display: flex;
        font-size: 48px;
        height: 88px;
        justify-content: center;
        margin: 0 auto 24px;
        width: 88px;
      }
      h1 { font-size: 28px; margin: 0 0 10px; }
      p { color: #777779; line-height: 1.5; margin: 0 0 24px; }
      a {
        background: #6c4df6;
        border-radius: 12px;
        color: white;
        display: block;
        font-weight: 700;
        padding: 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🐾</div>
      <h1>Esta publicacion es de PetFindr</h1>
      <p>Abre PetFindr para conocer todos los detalles y ayudar a esta mascota.</p>
      <a id="abrir-app" href="#">Abrir PetFindr</a>
    </main>
    <script>
      document.getElementById('abrir-app').href = window.location.href;
    </script>
  </body>
</html>
